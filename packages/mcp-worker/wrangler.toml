# Cloudflare Worker serving the stateless Kaiord MCP tools at kaiord.com/mcp
# (OpenSpec change add-remote-mcp-endpoint, D1/D6/D8/D9). The route is more
# specific than kaiord-agent-edge's kaiord.com/*, so it wins for /mcp only.
#
# Deploying is a production change (prod-deploy class): Pablo runs it himself.
#   npx wrangler@4 deploy
# `pnpm build` runs `wrangler deploy --dry-run --outdir dist`, which bundles
# without deploying.
name = "kaiord-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# Tool modules import node:fs and node:path for the local path inputs; on the
# remote toolset those paths are unreachable, but the imports must resolve.
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
logpush = false
send_metrics = false

routes = [
  { pattern = "kaiord.com/mcp", zone_name = "kaiord.com" },
]

# The KRD format spec (docs/krd-format.md) is served as a resource and by
# kaiord_get_format_spec; it is bundled as a string, not read from disk.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

# D8: no request metadata or content is persisted. Workers Logs, invocation
# logs, traces and Issues are all off, and nothing goes to Logpush (above).
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
persist = false

[observability.traces]
enabled = false
persist = false

# Real-time Issues would keep uncaught exception messages.
[observability.issues]
enabled = false

# No KV, D1, R2 or Durable Object bindings: the endpoint stores nothing.

# Per-IP rate limit, 60 requests per 60 s (D6); the handler answers 429 over
# it. The binding exists on Workers Free (task 3.3). Its counters are
# per-location and eventually consistent, so a concurrent burst can pass it:
# the WAF rule on /mcp (task 5.2), which runs before the Worker, stays the
# primary control.
[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
