<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy — Kaiord</title>
    <!--
      Kept as a 200 page because Chrome Web Store listings may still point at
      kaiord.com/privacy/. The single source of truth is the docs policy, linted
      by packages/docs/scripts/check-privacy-policy.mjs, which also checks this
      file so it can never carry policy copy of its own again.
    -->
    <link rel="canonical" href="https://kaiord.com/docs/legal/privacy-policy" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=/docs/legal/privacy-policy" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main>
      <h1>Privacy Policy</h1>
      <p>
        The Kaiord privacy policy has moved to
        <a href="/docs/legal/privacy-policy"
          >kaiord.com/docs/legal/privacy-policy</a
        >.
      </p>
    </main>
  </body>
</html>
