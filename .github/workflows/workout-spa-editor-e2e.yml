# Baseline wall-clock (2026-04-24, ubuntu-latest): not yet measured — run once
# on main after this PR merges to record actual duration.
# focus-management spec budget: baseline + 30% max.
# Advisory-only: record the measured time here and review on PRs that touch e2e/.
name: Workout SPA Editor E2E Tests

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    # P95 = 5s; ceil(P95 × 1.5 / 60) = 1; capped at lint-family ceiling 10.
    timeout-minutes: 1
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check if frontend changed
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const ref = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;
            const commits = await github.rest.repos.getCommit({ owner, repo, ref });
            const files = commits.data.files?.map(f => f.filename) || [];
            // The SPA, every workspace package it depends on (read from its
            // package.json at this commit, so the list cannot drift; all are
            // named @kaiord/<dir>), and the e2e pipeline itself, so a change
            // to this workflow or its composites is exercised by the run it
            // triggers. Root package.json/pnpm-lock.yaml/tsconfig.base.json
            // are excluded on purpose: CI installs and builds them first, and
            // matching them would run the full matrix on every dev-tool bump.
            const prefixes = [
              'packages/workout-spa-editor/',
              '.github/workflows/workout-spa-editor-e2e.yml',
              '.github/actions/setup-playwright/',
              '.github/actions/setup-pnpm/',
            ];
            let depsKnown = true;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, ref, path: 'packages/workout-spa-editor/package.json',
              });
              const pkg = JSON.parse(Buffer.from(data.content, 'base64').toString());
              const deps = { ...pkg.dependencies, ...pkg.devDependencies };
              for (const [name, spec] of Object.entries(deps)) {
                if (spec.startsWith('workspace:') && name.startsWith('@kaiord/')) {
                  prefixes.push(`packages/${name.slice('@kaiord/'.length)}/`);
                }
              }
            } catch (error) {
              depsKnown = false;
              core.warning(`Could not read SPA deps, running e2e: ${error.message}`);
            }
            // getCommit lists at most 300 files: a capped list may hide a match.
            const capped = files.length >= 300;
            const frontendChanged = !depsKnown || capped ||
              files.some(f => prefixes.some(p => f.startsWith(p)));
            core.setOutput('should-run', frontendChanged ? 'true' : 'false');
            console.log(`Frontend changed: ${frontendChanged}, files: ${files.length}`);

  e2e-tests:
    name: E2E Tests
    # Playwright runs with workers=1 on CI (playwright.config.ts), so the
    # job is the serial sum of every test. Firefox executes the same 338
    # specs ~1.5x slower per test than chromium (uniformly, no outliers, no
    # retries: 1829s vs 1212s of summed test time in run 38381213683, up to
    # 2462s on a slow runner), i.e. 31-45 min on one runner, which is what
    # kept brushing the cap and getting cancelled. The cure is parallelism,
    # not a bigger budget: firefox is split in 3 shards (~12-15 min each).
    # chromium/webkit stay a single shard (20-28 min).
    timeout-minutes: 40
    runs-on: ubuntu-latest
    needs: check-ci-status
    if: needs.check-ci-status.outputs.should-run == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 1 }
          - { browser: firefox, shard: 1, shards: 3 }
          - { browser: firefox, shard: 2, shards: 3 }
          - { browser: firefox, shard: 3, shards: 3 }
          - { browser: webkit, shard: 1, shards: 1 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # Browser + system packages from caches; apt is only contacted on a
      # cold key. The composite's internal budgets add up to 650s (browser
      # 90s + apt attempt 1 45s+90s + attempt 2 45s+240s + dpkg 60s+20s+60s);
      # the 12-min cap leaves 70s for cache restore/save. system-deps stays
      # `required`: firefox and webkit cannot launch without the packages.
      - name: Install Playwright browsers
        timeout-minutes: 12
        uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ matrix.browser }}

      - name: Build workspace dependencies
        run: pnpm -r build

      - name: Run E2E tests
        run: pnpm --filter @kaiord/workout-spa-editor test:e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/workout-spa-editor/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/workout-spa-editor/test-results/
          retention-days: 7

  e2e-mobile:
    name: E2E Mobile Tests
    timeout-minutes: 35
    runs-on: ubuntu-latest
    needs: check-ci-status
    if: needs.check-ci-status.outputs.should-run == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: "Mobile Chrome", browser: chromium }
          - { device: "Mobile Safari", browser: webkit }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # Browser + system packages from caches; apt is only contacted on a
      # cold key. The composite's internal budgets add up to 650s (browser
      # 90s + apt attempt 1 45s+90s + attempt 2 45s+240s + dpkg 60s+20s+60s);
      # the 12-min cap leaves 70s for cache restore/save. system-deps stays
      # `required`: firefox and webkit cannot launch without the packages.
      - name: Install Playwright browsers
        timeout-minutes: 12
        uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ matrix.browser }}

      - name: Build workspace dependencies
        run: pnpm -r build

      - name: Run mobile E2E tests
        run: pnpm --filter @kaiord/workout-spa-editor test:e2e --project="${{ matrix.device }}"
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mobile-${{ matrix.device }}
          path: packages/workout-spa-editor/playwright-report/
          retention-days: 7
