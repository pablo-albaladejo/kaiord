name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update baselines on (must already exist on origin)"
        required: true
        type: string
      spec:
        description: "Playwright spec filter (regex matched against file paths under packages/workout-spa-editor/e2e)"
        required: false
        type: string
        default: "visual\\.spec\\.ts"

permissions:
  contents: write

jobs:
  update-baselines:
    name: Regenerate Playwright snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # The push below runs the husky pre-push hook (`pnpm lint` + tsc),
          # as it does locally. Its history guards need a full clone and
          # origin/main: lint:coverage-floors and lint:boundaries-allowlist
          # diff against the merge base with origin/main, and
          # lint:method-figures resolves commits deep in the history. A
          # shallow clone makes all three fail closed and blocks the push.
          fetch-depth: 0

      # Explicit, so the merge-base guards never depend on which refs the
      # checkout happened to map for a non-default `ref`.
      - name: Fetch origin/main for the pre-push guards
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # Same browser + system packages as the e2e jobs whose baselines this
      # regenerates; `required` so a baseline is never rendered without the
      # fonts the comparing jobs install.
      - name: Install Playwright browsers
        timeout-minutes: 12
        uses: ./.github/actions/setup-playwright
        with:
          browser: chromium

      # Also what the pre-push hook needs: its lint and `tsc --noEmit`
      # resolve workspace packages through their built `dist/`.
      - name: Build workspace dependencies
        run: pnpm -r build

      - name: Regenerate snapshots
        run: |
          pnpm --filter @kaiord/workout-spa-editor exec playwright test \
            "${{ inputs.spec }}" \
            --project=chromium \
            --update-snapshots=all
        env:
          CI: true

      - name: Commit and push snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain packages/workout-spa-editor)" ]]; then
            echo "No snapshot changes — branch already has up-to-date baselines."
            exit 0
          fi
          git add packages/workout-spa-editor
          git commit -m "chore(spa-editor): regenerate visual baselines via update-visual-baselines workflow"
          git push origin HEAD:${{ inputs.branch }}
