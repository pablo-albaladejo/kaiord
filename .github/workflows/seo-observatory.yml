# Weekly SEO/GEO measurement for kaiord.com.
#
# Collectors write time series to reports/seo/timeseries/*.jsonl and this
# workflow keeps ONE rolling metrics PR (branch auto/seo-observatory) with the
# refreshed dashboard for the owner to review (reviewing the DASHBOARD.md diff
# IS the weekly SEO review). Each run starts from main; while the rolling PR is
# open (same repository only, never a fork: scripts/geo/rolling-pr.mjs) it
# merges the weeks already on the branch (scripts/geo/union-timeseries.mjs:
# main wins per (date, source, provider), the branch adds only what main
# lacks). A PR closed unmerged, or a deleted branch, restarts from main.
# It then collects this week, pushes the branch and updates the open PR or
# opens one. Every collector no-ops gracefully when its secret is missing:
#   GSC_SERVICE_ACCOUNT_JSON   Google Search Console (service account)
#   BING_WEBMASTER_API_KEY     Bing Webmaster Tools
#   PERPLEXITY_API_KEY         Perplexity (AI answer-engine visibility)
# SEO_OBSERVATORY_PR_TOKEN is REQUIRED (the run fails without it): a push made
# with GITHUB_TOKEN does not trigger pull_request workflows, so the PR's
# required checks would stay pending and it could never merge. It is read by
# the publish step only: checkout does not persist it, so no collector or
# merge step can.
# The DDG SERP snapshot needs no secret and always runs. The collectors are
# stdlib-only Node scripts, so no pnpm install / workspace build is required.
name: SEO Observatory

on:
  schedule:
    # Mondays 07:37 UTC (staggered after sibling repos' observatory runs).
    - cron: "37 7 * * 1"
  workflow_dispatch:

# The PAT does every write (push + PR); the workflow token only reads (the
# repository, and the open PRs to find the rolling one).
permissions:
  contents: read
  pull-requests: read

# Serializes runs (queue, don't cancel) so a manual dispatch landing near the
# scheduled cron waits for the in-flight run instead of racing it — both would
# otherwise walk the full GSC URL-inspection loop and race each other's push
# to the rolling branch. cancel-in-progress stays false: cancelling a
# legitimate in-flight run to make room for a newer one would lose that
# week's collected data, not just skip a no-op.
concurrency:
  group: seo-observatory
  cancel-in-progress: false

jobs:
  observe:
    name: Collect SEO/GEO metrics
    runs-on: ubuntu-latest
    # Network-bound collectors with widely-spaced requests. The GSC URL
    # Inspection loop dominates: 2471-2599s in runs 34128612052, 34855248940
    # and 35612637770, whose jobs took 2540-2676s against the old 45-minute
    # (2700s) bound. The AI probe took 28-30s for 5 questions (~6s each incl.
    # the 1s sleep); the 20-prompt panel adds ~120s. The restore fetch and the
    # artifact upload add ~10s. ceil((2676 + 120 + 10) x 1.5 / 60) = 71. The
    # calibration families (lint 10 / build 20 / test 30 / e2e 45) have no
    # network family; this exceeds even the largest, e2e's 45, on purpose,
    # because the old 45-minute bound was already only 24s from cutting the
    # real inspection loop.
    # Recompute after the first runs on the smaller sitemap: GSC now inspects
    # about 40 URLs instead of 377 (PR #1268), so the loop, and this bound,
    # should drop by roughly an order of magnitude.
    timeout-minutes: 71
    steps:
      - name: Require the PR token
        env:
          PAT: ${{ secrets.SEO_OBSERVATORY_PR_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::SEO_OBSERVATORY_PR_TOKEN is required (GITHUB_TOKEN pushes do not trigger synchronize; checks would stay pending)"
            exit 1
          fi

      # Full history so the rolling branch can be read. The repository is
      # public, so fetching needs no credential; persist-credentials: false
      # keeps any token out of .git/config, where every later step (and every
      # collector) could read it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # restore=true only while the rolling PR (this repository's, never a
      # fork's) is open; lease = the branch's SHA, or empty when it is absent.
      - name: Plan the rolling-branch restore
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/geo/rolling-pr.mjs plan >> "$GITHUB_OUTPUT"

      # Weeks already on the open rolling PR but not yet merged into main are
      # merged into the working tree, so rebuilding the branch from main below
      # never drops them.
      - name: Restore rolling data
        if: steps.plan.outputs.restore == 'true'
        run: |
          set -e
          git fetch origin +refs/heads/auto/seo-observatory:refs/remotes/origin/auto/seo-observatory
          node scripts/geo/union-timeseries.mjs --branch origin/auto/seo-observatory

      # The reports/seo/ tree before any collector runs (main plus the
      # restored weeks), as a commit object outside every branch. The publish
      # retry takes from this run only what is newer than it.
      - name: Mark the state before collection
        id: before
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          export GIT_INDEX_FILE="$RUNNER_TEMP/before.index"
          git read-tree HEAD
          git add -A reports/seo/
          TREE=$(git write-tree)
          echo "sha=$(git commit-tree "$TREE" -p HEAD -m 'before collection')" >> "$GITHUB_OUTPUT"

      - name: Google Search Console snapshot
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/geo/gsc-snapshot.mjs

      - name: Bing Webmaster snapshot
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/geo/bing-snapshot.mjs

      - name: SERP snapshot (DDG, keyless)
        run: node scripts/geo/serp-snapshot.mjs

      - name: AI answer-engine visibility probe
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: node scripts/geo/ai-visibility-probe.mjs

      - name: Regenerate dashboard
        run: node scripts/geo/seo-dashboard.mjs

      - name: Detect changes
        id: detect
        run: |
          if git status --porcelain reports/seo/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No metric changes against main."
          fi

      # The week's data survives a failed push: the artifact holds it.
      - name: Keep this week's data
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: seo-observatory-${{ github.run_id }}
          path: reports/seo/
          retention-days: 90

      # One branch, one PR. The branch is rebuilt from main each week (so it
      # always merges cleanly) and carries every unmerged week via the restore
      # above. --force-with-lease pins the SHA read by the plan step (empty =
      # the branch must not exist yet), so a concurrent push is never
      # overwritten blindly. If the push is refused, the retry plans again
      # (the PR may have been closed, or the branch deleted, meanwhile),
      # rebuilds the branch on the current main, merges the rolling branch
      # only if its PR is still open, adds this run's records (those newer
      # than the pre-collection mark) and pushes once more. The PAT reaches
      # git only through a one-shot extraheader, never .git/config; the plan
      # uses the read-only workflow token, and the merge and dashboard
      # re-runs are started without either token.
      - name: Publish the rolling metrics PR
        if: steps.detect.outputs.changed == 'true'
        env:
          PAT: ${{ secrets.SEO_OBSERVATORY_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.SEO_OBSERVATORY_PR_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          LEASE: ${{ steps.plan.outputs.lease }}
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          BRANCH="auto/seo-observatory"
          AUTH=$(printf 'x-access-token:%s' "$PAT" | base64 -w0)
          echo "::add-mask::$AUTH"
          push() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              push --force-with-lease="$BRANCH:$LEASE" origin "HEAD:refs/heads/$BRANCH"
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add reports/seo/
          git commit -m "chore(seo): weekly SEO/GEO observatory snapshot"
          if ! push; then
            echo "::warning::$BRANCH changed during the run; rebuilding on the current main and retrying once"
            OURS=$(git rev-parse HEAD)
            git fetch origin main
            PLAN=$(GH_TOKEN="$READ_TOKEN" env -u PAT node scripts/geo/rolling-pr.mjs plan)
            echo "$PLAN"
            LEASE=$(sed -n 's/^lease=//p' <<<"$PLAN")
            git checkout -B "$BRANCH" origin/main
            if grep -qx 'restore=true' <<<"$PLAN"; then
              git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
              env -u PAT -u GH_TOKEN node scripts/geo/union-timeseries.mjs --branch "origin/$BRANCH"
            fi
            env -u PAT -u GH_TOKEN node scripts/geo/union-timeseries.mjs --branch "$OURS" --since "$BEFORE"
            env -u PAT -u GH_TOKEN node scripts/geo/seo-dashboard.mjs
            git add -A reports/seo/
            if git diff --cached --quiet; then
              echo "Nothing of this run is missing from main; nothing to publish."
              exit 0
            fi
            git commit -m "chore(seo): weekly SEO/GEO observatory snapshot"
            push
          fi
          BODY="Rolling snapshot from the SEO/GEO observatory (\`.github/workflows/seo-observatory.yml\`), last updated $(date -u +%Y-%m-%d) by run ${{ github.run_id }}. While this PR is open, each week's run rebuilds this branch from \`main\` and merges every week not yet merged, so merging it at any time loses nothing; closing it unmerged discards its weeks. Review \`reports/seo/DASHBOARD.md\` in this diff; raw data lands in \`reports/seo/timeseries/\` and \`reports/seo/snapshots/\`."
          N=$(node scripts/geo/rolling-pr.mjs find)
          if [ -n "$N" ]; then
            gh pr edit "$N" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated PR #$N"
          else
            gh label create seo --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "SEO/GEO observatory" 2>/dev/null || true
            gh label create automated --repo "$GITHUB_REPOSITORY" --color ededed --description "Automated PR" 2>/dev/null || true
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore(seo): weekly SEO/GEO observatory snapshot" \
              --body "$BODY" \
              --label seo \
              --label automated
          fi
