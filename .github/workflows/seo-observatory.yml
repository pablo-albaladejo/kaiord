# Weekly SEO/GEO measurement for kaiord.com.
#
# Collectors write time series to reports/seo/timeseries/*.jsonl and this
# workflow keeps ONE rolling metrics PR (branch auto/seo-observatory) with the
# refreshed dashboard for the owner to review (reviewing the DASHBOARD.md diff
# IS the weekly SEO review). Each run starts from main, union-merges the data
# already on the rolling branch (scripts/geo/union-timeseries.mjs: a line only
# on main and a line only on the branch both survive), collects this week,
# force-pushes the branch and updates the open PR or opens one. Every
# collector no-ops gracefully when its secret is missing:
#   GSC_SERVICE_ACCOUNT_JSON   Google Search Console (service account)
#   BING_WEBMASTER_API_KEY     Bing Webmaster Tools
#   PERPLEXITY_API_KEY         Perplexity (AI answer-engine visibility)
# SEO_OBSERVATORY_PR_TOKEN is REQUIRED (the run fails without it): a push made
# with GITHUB_TOKEN does not trigger pull_request workflows, so the PR's
# required checks would stay pending and it could never merge.
# The DDG SERP snapshot needs no secret and always runs. The collectors are
# stdlib-only Node scripts, so no pnpm install / workspace build is required.
name: SEO Observatory

on:
  schedule:
    # Mondays 07:37 UTC (staggered after sibling repos' observatory runs).
    - cron: "37 7 * * 1"
  workflow_dispatch:

# The PAT does every write (push + PR); the workflow token only reads.
permissions:
  contents: read

# Serializes runs (queue, don't cancel) so a manual dispatch landing near the
# scheduled cron waits for the in-flight run instead of racing it — both would
# otherwise walk the full GSC URL-inspection loop and race each other's push
# to the rolling branch. cancel-in-progress stays false: cancelling a
# legitimate in-flight run to make room for a newer one would lose that
# week's collected data, not just skip a no-op.
concurrency:
  group: seo-observatory
  cancel-in-progress: false

jobs:
  observe:
    name: Collect SEO/GEO metrics
    runs-on: ubuntu-latest
    # Network-bound collectors with widely-spaced requests (SERP + AI probe
    # sleep between calls). The GSC collector additionally runs a URL
    # Inspection call per sitemap entry (250ms floor + real API latency each);
    # kaiord's docs corpus alone is ~370 URLs, so once GSC credentials exist
    # that loop can take 10+ minutes on its own. 45m bounds a stuck run well
    # under the family ceiling while giving the real inspection loop headroom.
    # Calibration is a human decision per PR.
    timeout-minutes: 45
    steps:
      - name: Require the PR token
        env:
          PAT: ${{ secrets.SEO_OBSERVATORY_PR_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::SEO_OBSERVATORY_PR_TOKEN is required (GITHUB_TOKEN pushes do not trigger synchronize; checks would stay pending)"
            exit 1
          fi

      # Full history so the rolling branch can be read, and the PAT so the
      # force-push below fires `synchronize` and the required checks run.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SEO_OBSERVATORY_PR_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Weeks already on the rolling branch but not yet merged into main are
      # union-merged into the working tree, so rebuilding the branch from main
      # below never drops them.
      - name: Restore rolling data
        run: |
          set -e
          rc=0
          git ls-remote --exit-code --heads origin auto/seo-observatory >/dev/null || rc=$?
          if [ "$rc" = "2" ]; then
            echo "No rolling branch yet; starting from main."
            exit 0
          fi
          [ "$rc" = "0" ] || { echo "::error::git ls-remote failed ($rc)"; exit 1; }
          git fetch origin +refs/heads/auto/seo-observatory:refs/remotes/origin/auto/seo-observatory
          node scripts/geo/union-timeseries.mjs --branch origin/auto/seo-observatory

      - name: Google Search Console snapshot
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/geo/gsc-snapshot.mjs

      - name: Bing Webmaster snapshot
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/geo/bing-snapshot.mjs

      - name: SERP snapshot (DDG, keyless)
        run: node scripts/geo/serp-snapshot.mjs

      - name: AI answer-engine visibility probe
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: node scripts/geo/ai-visibility-probe.mjs

      - name: Regenerate dashboard
        run: node scripts/geo/seo-dashboard.mjs

      - name: Detect changes
        id: detect
        run: |
          if git status --porcelain reports/seo/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No metric changes against main."
          fi

      # One branch, one PR. The branch is rebuilt from main each week (so it
      # always merges cleanly) and carries every unmerged week via the union
      # above. --force-with-lease pins the SHA read in "Restore rolling data"
      # (empty = the branch must not exist yet), so a concurrent push is never
      # overwritten blindly.
      - name: Publish the rolling metrics PR
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SEO_OBSERVATORY_PR_TOKEN }}
        run: |
          set -e
          BRANCH="auto/seo-observatory"
          LEASE=$(git rev-parse -q --verify "refs/remotes/origin/$BRANCH" || true)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add reports/seo/
          git commit -m "chore(seo): weekly SEO/GEO observatory snapshot"
          git push --force-with-lease="$BRANCH:$LEASE" origin "HEAD:refs/heads/$BRANCH"
          BODY="Rolling snapshot from the SEO/GEO observatory (\`.github/workflows/seo-observatory.yml\`), last updated $(date -u +%Y-%m-%d) by run ${{ github.run_id }}. Each week's run rebuilds this branch from \`main\` and union-merges every week not yet merged, so merging this PR at any time loses nothing. Review \`reports/seo/DASHBOARD.md\` in this diff; raw data lands in \`reports/seo/timeseries/\` and \`reports/seo/snapshots/\`."
          N=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then
            gh pr edit "$N" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated PR #$N"
          else
            gh label create seo --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "SEO/GEO observatory" 2>/dev/null || true
            gh label create automated --repo "$GITHUB_REPOSITORY" --color ededed --description "Automated PR" 2>/dev/null || true
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore(seo): weekly SEO/GEO observatory snapshot" \
              --body "$BODY" \
              --label seo \
              --label automated
          fi
