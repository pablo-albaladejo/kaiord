name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "packages/core/**"
      - "packages/fit/**"
      - "packages/tcx/**"
      - "packages/zwo/**"
      - "packages/garmin/**"
      - "packages/garmin-connect/**"
      - "packages/cli/**"
      - "packages/mcp/**"
      - "packages/ai/**"
      - "packages/garmin-bridge/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    # npm publish is the dominant cost (external-network-bound). The P95-derived
    # value (ceil(480s × 1.5 / 60) = 12) reflects typical small releases, but a
    # full-fleet release (all 9 packages in one changeset batch, with provenance)
    # overruns it — the 9.2.0 release was killed at 12m right after publish, so
    # changesets never pushed tags / created GitHub releases. Use a fixed 20m of
    # headroom for the worst case, still within the test-family ceiling of 30.
    timeout-minutes: 20
    steps:
      # Mint a short-lived (1h) token from the kaiord-release-bot GitHub App.
      # Required so the "Version Packages" PR pushed by changesets/action
      # triggers branch-protection-required workflows on the new commit
      # (GITHUB_TOKEN-authored pushes are intentionally excluded by GitHub
      # Actions, which would leave the PR unmergeable).
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least-privilege: the release scripts only bump versions,
          # publish to npm, and open the Version Packages PR. They never
          # modify .github/workflows/, so deny workflows:write even though
          # the App grants it (kept at App level for future extensions).
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # v2 renamed the inputs (version → version-script, publish →
          # publish-script) and stopped reading GITHUB_TOKEN from the env —
          # the app token must go through the github-token input, which the
          # action also injects into the custom scripts' environment.
          version-script: ./scripts/changeset-version.sh
          publish-script: ./scripts/changeset-publish.sh
          github-token: ${{ steps.app-token.outputs.token }}
          # Single GitHub-release owner: the action (matches the historical
          # release format — the custom scripts/create-github-releases.js step
          # always found the release already created and skipped; kept on disk
          # for manual backfills only).
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: true

      # The MCP Registry entry (packages/mcp/server.json, synced to the
      # @kaiord/mcp version by changeset-version.sh) goes up with every
      # @kaiord/mcp release. The registry rejects a version it already has,
      # so a skipped publish can only be caught up by the next release.
      # Login is GitHub OIDC (id-token: write above): no stored secret.
      - name: Publish to the MCP Registry
        if: contains(steps.changesets.outputs.published-packages, '"@kaiord/mcp"')
        working-directory: packages/mcp
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

      - name: Summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "## 📦 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.changesets.outputs.published-packages }}' | node -e "
            const pkgs = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            for (const p of pkgs) {
              console.log('- ✅ [' + p.name + '@' + p.version + '](https://www.npmjs.com/package/' + p.name + '/v/' + p.version + ')');
            }
          " >> $GITHUB_STEP_SUMMARY

      - name: No packages published
        if: steps.changesets.outputs.published != 'true'
        run: |
          echo "## ℹ️ No Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No packages were published. Either:" >> $GITHUB_STEP_SUMMARY
          echo "- A **Version Packages** PR was created/updated (check open PRs)" >> $GITHUB_STEP_SUMMARY
          echo "- No pending changesets were found" >> $GITHUB_STEP_SUMMARY
