name: CI Issue Bot — Close on Green

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  issues: write

jobs:
  notify-success:
    name: Auto-close stale CI failure issues
    runs-on: ubuntu-latest
    # P95 = 8s; ceil(P95 × 1.5 / 60) = 1; capped at lint-family ceiling 10.
    timeout-minutes: 1
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.CI_ISSUE_BOT_ENABLED != 'false' }}
    concurrency:
      group: ci-issue-bot-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - name: Collect the green run's job results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          # Hand the close-pass the full job list and let it decide per-issue
          # whether THAT issue's failed jobs re-ran green (see the v2 close-rule
          # in scripts/ci-failure-issue-helpers.mjs). The previous "was anything
          # skipped?" boolean was unsatisfiable: ci.yml's `log-bot-skip` and
          # `notify-failure` are skipped on every green run by construction, so
          # the gate was always true and the bot never closed anything.
          #
          # --paginate is required: a full CI run has >30 jobs (54 observed) and
          # the API pages at 30, so an unpaginated read silently truncated.
          # --jq emits one object per line per page; `jq -sc` slurps the pages
          # into a single array.
          #
          # pipefail is load-bearing: without it, a gh failure part-way through
          # pagination still streams the pages it did fetch into jq, which exits
          # 0, and the step would succeed with a silently truncated list. A
          # short list does not look like an error to the close-pass — it looks
          # like "those jobs did not run" for the missing ones and like a
          # legitimate green run for the rest. Fail the step instead.
          set -o pipefail
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | {name, conclusion}' | jq -sc .)
          echo "GREEN_RUN_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "collected $(echo "$jobs" | jq 'length') jobs from run $RUN_ID"
      - name: Auto-close CI failure issues whose jobs re-ran green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_ACTOR: ${{ github.event.workflow_run.actor.login }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node scripts/ci-failure-issue.mjs close
