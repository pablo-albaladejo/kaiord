name: Security Audit

on:
  # Weekly schedule - Mondays at 9 AM UTC
  schedule:
    - cron: "0 9 * * 1"

  # Every push to main. Without this the audit never observes the branch it
  # guards: a transitive advisory landing on an already-pinned version (the
  # fast-uri 4.1.2 case in #1214) changes no manifest, so the paths filter
  # below never fires and the weekly cron is the only thing that would ever
  # notice. See #1166.
  push:
    branches:
      - main

  # PR with dependency changes
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/*/package.json"

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    # P95 = 44s; ceil(P95 × 1.5 / 60) = 2; capped at lint-family ceiling 10.
    timeout-minutes: 2
    # One audit per ref at a time, so two runs cannot race on the alert issue.
    concurrency:
      group: security-audit-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run security audit
        id: audit
        continue-on-error: true
        run: |
          # Run npm audit and parse results
          # Audit level: moderate (catches moderate, high, and critical vulnerabilities)
          echo "Running pnpm audit (production dependencies only)..."
          pnpm audit --prod --audit-level=moderate --json > audit-results.json || true

          # Parse audit results using jq
          # Extract vulnerability counts by severity for detailed reporting

          # Trust the report only by its shape. A registry failure makes
          # `pnpm audit --json` print valid JSON such as {"error":{...}}, which
          # has no counts; reading it with `// 0` would report a clean audit.
          # A missing or empty file also fails the shape check.
          if jq -e 'type == "object" and (has("error") | not) and (.metadata.vulnerabilities | type == "object")' audit-results.json > /dev/null 2>&1; then
            # pnpm audit --json uses .metadata.vulnerabilities with counts per severity
            INFO=$(jq '.metadata.vulnerabilities.info // 0' audit-results.json)
            LOW=$(jq '.metadata.vulnerabilities.low // 0' audit-results.json)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-results.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)

            # Output vulnerability counts for downstream steps (using block redirect)
            # `parsed=true` marks counts read from a real audit report. Only a
            # parsed report may decide pass/fail or close the alert issue.
            {
              echo "parsed=true"
              echo "info=$INFO"
              echo "low=$LOW"
              echo "moderate=$MODERATE"
              echo "high=$HIGH"
              echo "critical=$CRITICAL"
            } >> "$GITHUB_OUTPUT"

            TOTAL=$((INFO + LOW + MODERATE + HIGH + CRITICAL))
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

            # Determine workflow status based on severity
            # FAIL: High or critical vulnerabilities (immediate action required)
            # WARN: Moderate or low vulnerabilities (address in follow-up)
            # PASS: No vulnerabilities detected
            if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
              {
                echo "has_critical=true"
                echo "status=failed"
              } >> "$GITHUB_OUTPUT"
            elif [ "$MODERATE" -gt 0 ] || [ "$LOW" -gt 0 ]; then
              {
                echo "has_critical=false"
                echo "status=warning"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "has_critical=false"
                echo "status=passed"
              } >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::pnpm audit did not produce a vulnerability report"
            head -c 2000 audit-results.json 2>/dev/null || true
            {
              echo "parsed=false"
              echo "status=error"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Display audit summary
        if: always()
        run: |
          {
            echo "## Security Audit Summary"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| Critical | ${{ steps.audit.outputs.critical || 0 }} |"
            echo "| High | ${{ steps.audit.outputs.high || 0 }} |"
            echo "| Moderate | ${{ steps.audit.outputs.moderate || 0 }} |"
            echo "| Low | ${{ steps.audit.outputs.low || 0 }} |"
            echo "| Info | ${{ steps.audit.outputs.info || 0 }} |"
            echo ""
            echo "**Total vulnerabilities:** ${{ steps.audit.outputs.total || 0 }}"

            if [ "${{ steps.audit.outputs.status }}" = "failed" ]; then
              echo ""
              echo "❌ **Status:** Failed - High or critical vulnerabilities detected"
            elif [ "${{ steps.audit.outputs.status }}" = "warning" ]; then
              echo ""
              echo "⚠️ **Status:** Warning - Moderate or low vulnerabilities detected"
            elif [ "${{ steps.audit.outputs.status }}" = "passed" ]; then
              echo ""
              echo "✅ **Status:** Passed - No vulnerabilities detected"
            else
              echo ""
              echo "❌ **Status:** Error - The audit did not produce a vulnerability report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR with vulnerability summary
        if: github.event_name == 'pull_request' && steps.audit.outputs.parsed == 'true' && steps.audit.outputs.total != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const info = ${{ steps.audit.outputs.info || 0 }};
            const low = ${{ steps.audit.outputs.low || 0 }};
            const moderate = ${{ steps.audit.outputs.moderate || 0 }};
            const high = ${{ steps.audit.outputs.high || 0 }};
            const critical = ${{ steps.audit.outputs.critical || 0 }};
            const total = ${{ steps.audit.outputs.total || 0 }};
            const status = '${{ steps.audit.outputs.status }}';

            let emoji = '✅';
            let statusText = 'No vulnerabilities detected';

            if (status === 'failed') {
              emoji = '❌';
              statusText = 'High or critical vulnerabilities detected';
            } else if (status === 'warning') {
              emoji = '⚠️';
              statusText = 'Moderate or low vulnerabilities detected';
            }

            const body = `## ${emoji} Security Audit Results

            **Status:** ${statusText}

            | Severity | Count |
            |----------|-------|
            | Critical | ${critical} |
            | High | ${high} |
            | Moderate | ${moderate} |
            | Low | ${low} |
            | Info | ${info} |

            **Total vulnerabilities:** ${total}

            ${high > 0 || critical > 0 ? '⚠️ **Action Required:** Please review and fix high/critical vulnerabilities before merging.' : ''}
            ${moderate > 0 || low > 0 ? 'ℹ️ Consider addressing moderate/low vulnerabilities in a follow-up PR.' : ''}

            <details>
            <summary>Remediation Steps</summary>

            1. Review the audit results: \`pnpm audit\`
            2. Update vulnerable dependencies: \`pnpm update\`
            3. For breaking changes, check package changelogs
            4. Run tests to ensure compatibility: \`pnpm test\`
            5. If no fix is available, consider:
               - Finding alternative packages
               - Waiting for upstream fixes
               - Applying workarounds if risk is acceptable

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Create or update GitHub issue for critical vulnerabilities
        if: >-
          steps.audit.outputs.has_critical == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            // One open alert issue at a time: find it by labels + body marker
            // (or the legacy title prefix, for issues created before the
            // marker existed) and update it in place instead of opening a
            // new one on every red run.
            const MARKER = '<!-- security-audit-alert -->';
            const TITLE_PREFIX = '🚨 Security Alert:';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });
            const existing = open.find(
              (i) =>
                !i.pull_request &&
                ((i.body || '').includes(MARKER) || i.title.startsWith(TITLE_PREFIX)),
            );

            const critical = ${{ steps.audit.outputs.critical || 0 }};
            const high = ${{ steps.audit.outputs.high || 0 }};
            const moderate = ${{ steps.audit.outputs.moderate || 0 }};
            const low = ${{ steps.audit.outputs.low || 0 }};
            const info = ${{ steps.audit.outputs.info || 0 }};

            const title = `🚨 Security Alert: ${critical} Critical and ${high} High Vulnerabilities Detected`;

            const body = `## Security Audit Alert

            The security audit has detected **critical or high severity vulnerabilities** in our dependencies.

            ### Vulnerability Summary

            | Severity | Count |
            |----------|-------|
            | Critical | ${critical} |
            | High | ${high} |
            | Moderate | ${moderate} |
            | Low | ${low} |
            | Info | ${info} |

            ### Workflow Details

            - **Workflow Run:** [View Details](${context.payload.repository.html_url}/actions/runs/${context.runId})
            - **Triggered:** ${new Date().toISOString()}
            - **Branch:** ${context.ref}

            ### Remediation Steps

            1. **Review the audit results:**
               \`\`\`bash
               pnpm audit
               \`\`\`

            2. **Update vulnerable dependencies:**
               \`\`\`bash
               pnpm update
               \`\`\`

            3. **For specific packages:**
               \`\`\`bash
               pnpm update <package-name>
               \`\`\`

            4. **Check for breaking changes:**
               - Review package changelogs
               - Test thoroughly after updates

            5. **Run tests to ensure compatibility:**
               \`\`\`bash
               pnpm test
               \`\`\`

            6. **If no fix is available:**
               - Look for alternative packages
               - Wait for upstream fixes
               - Apply workarounds if risk is acceptable
               - Document the decision

            ### Priority

            ${critical > 0 ? '🔴 **CRITICAL:** Immediate action required' : '🟠 **HIGH:** Address within 48 hours'}

            ### Additional Resources

            - [npm Security Best Practices](https://docs.npmjs.com/packages-and-modules/securing-your-code)
            - [OWASP Dependency Check](https://owasp.org/www-project-dependency-check/)
            - [Snyk Vulnerability Database](https://snyk.io/vuln/)

            ---

            This issue is kept up to date by the Security Audit workflow. It is updated in place on every red run and closed when the audit on main is clean.

            ${MARKER}`;

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: title,
                body: body,
              });
              core.info(`Updated security alert issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'dependencies', 'automated']
              });
              core.info(`Created security alert issue #${created.number}`);
            }

      - name: Close security alert issue when main is clean
        continue-on-error: true
        if: >-
          steps.audit.outputs.parsed == 'true' &&
          steps.audit.outputs.has_critical == 'false' &&
          (github.event_name == 'push' || github.event_name == 'schedule') &&
          github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const MARKER = '<!-- security-audit-alert -->';
            const TITLE_PREFIX = '🚨 Security Alert:';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });
            const existing = open.find(
              (i) =>
                !i.pull_request &&
                ((i.body || '').includes(MARKER) || i.title.startsWith(TITLE_PREFIX)),
            );
            if (!existing) {
              core.info('No open security alert issue to close');
              return;
            }
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `The security audit on \`main\` now reports 0 critical and 0 high vulnerabilities ([run](${runUrl})). Closing.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed security alert issue #${existing.number}`);

      - name: Fail workflow if the audit did not produce a report
        if: steps.audit.outputs.parsed != 'true'
        run: |
          echo "❌ Security audit failed: pnpm audit did not produce a vulnerability report"
          exit 1

      - name: Fail workflow if critical vulnerabilities found
        if: steps.audit.outputs.has_critical == 'true'
        run: |
          echo "❌ Security audit failed: High or critical vulnerabilities detected"
          echo "Critical: ${{ steps.audit.outputs.critical }}"
          echo "High: ${{ steps.audit.outputs.high }}"
          exit 1

      - name: Pass with warning for moderate/low vulnerabilities
        if: steps.audit.outputs.status == 'warning'
        run: |
          echo "⚠️ Security audit passed with warnings"
          echo "Moderate: ${{ steps.audit.outputs.moderate }}"
          echo "Low: ${{ steps.audit.outputs.low }}"
          echo "Consider addressing these vulnerabilities in a follow-up PR"
