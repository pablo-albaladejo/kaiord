name: Deploy Kaiord Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/landing/**"
      - "packages/workout-spa-editor/**"
      - "packages/docs/**"
      - "packages/core/**"
      - "packages/fit/**"
      - "packages/tcx/**"
      - "packages/zwo/**"
      - "packages/garmin/**"
      - "styles/**"
      - ".github/workflows/deploy-site.yml"
      - "scripts/inject-spa-fallback.mjs"
      - "scripts/emit-legacy-editor-page.mjs"
      - "scripts/check-site-links.mjs"
      - "scripts/lib/site-links-resolve.mjs"
      - "scripts/lib/site-links-scan.mjs"
      - "scripts/geo/indexnow.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # P95 = 118s; ceil(P95 × 1.5 / 60) = 3; capped at build-family ceiling 20.
    # The added guards cost < 1s: the CI "Site guards" step (the same link
    # check plus the docs tests) ran 12:14:22 → 12:14:22 in run 36420377432
    # (PR #1267, same runner class), and the emitter only writes one file.
    # ceil((118 + 1) × 1.5 / 60) = 3.
    # Full history + git dates (PR #1268, run 36429027033 vs run 36420377432,
    # same runner class): checkout 3s vs 2s at depth 1 (+1s); "Build all
    # packages" 39s vs 46s (VitePress lastUpdated and the per-page git log add
    # no measurable time); the docs indexing guard runs inside "Site guards",
    # 1s. ceil((118 + 1 + 1 + 1) × 1.5 / 60) = ceil(3.03) = 4, not the 3
    # written here before (an arithmetic slip; the first post-merge run,
    # 36438339968, took 122s).
    # IndexNow (PR C5): fetching both live sitemaps took 0.04-0.48s
    # (`time curl -sf https://kaiord.com/sitemap-landing.xml
    # https://kaiord.com/docs/sitemap.xml`, 3 runs), the diff is in-memory
    # over 40 URLs (< 1s), and uploading one small file costs at most what
    # "Upload build artifacts" took for all the dists in CI run 36429027033
    # (2s). ceil((122 + 0.5 + 1 + 2) × 1.5 / 60) = ceil(3.14) = 4.
    timeout-minutes: 4
    outputs:
      spa_marker: ${{ steps.spa_marker.outputs.marker }}
    steps:
      # Full history: the sitemaps date each page from its last commit (a
      # depth-1 clone would date every page HEAD). REQUIRE_FULL_HISTORY=1 on
      # the builds and guards makes a shallow checkout fail the deploy.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      # Always build all packages — the merged artifact must be complete.
      # Targeted filters build only required transitive dependencies.
      - name: Build Landing Page
        env:
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          REQUIRE_FULL_HISTORY: "1"
        run: pnpm --filter @kaiord/landing... build

      - name: Build SPA Editor
        env:
          VITE_BASE_PATH: /app/
        run: pnpm --filter @kaiord/workout-spa-editor... build

      # Inject the Umami website id at deploy time (runtime config). The
      # bundles are environment-agnostic per 12-factor III + V — see
      # packages/workout-spa-editor/docs/analytics.md. When the secret is
      # absent the placeholders remain and the noop analytics adapter wins.
      # Two artifacts carry the __UMAMI_WEBSITE_ID__ placeholder: the editor
      # SPA index.html (runtime config) and the landing 404.html (a public/
      # file that bypasses Vite's build-time replacement). The landing
      # index.html is already substituted at build time via
      # VITE_UMAMI_WEBSITE_ID.
      - name: Substitute analytics website id
        env:
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: |
          set -e
          if [ -z "${UMAMI_WEBSITE_ID:-}" ]; then
            echo "UMAMI_WEBSITE_ID unset; leaving placeholders (analytics disabled)"
            exit 0
          fi
          for f in \
            packages/workout-spa-editor/dist/index.html \
            packages/landing/dist/404.html; do
            test -f "$f" || { echo "::error::Build artifact missing: $f"; exit 1; }
            # Use | as the delimiter to avoid escaping issues.
            sed -i "s|__UMAMI_WEBSITE_ID__|${UMAMI_WEBSITE_ID}|g" "$f"
            # Verify substitution actually replaced the placeholder so a
            # silent failure does not ship a no-analytics build.
            if grep -q "__UMAMI_WEBSITE_ID__" "$f"; then
              echo "::error::Placeholder __UMAMI_WEBSITE_ID__ still present in $f after sed"
              exit 1
            fi
          done
          echo "Analytics website id injected at runtime"

      - name: Build Docs
        env:
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          REQUIRE_FULL_HISTORY: "1"
        run: pnpm --filter @kaiord/docs... build

      # noindex ⇄ sitemap agreement, unique titles/descriptions, and real
      # (not all-identical) lastmods, over the docs build about to ship.
      - name: Docs indexing guard
        env:
          REQUIRE_DOCS_DIST: "1"
          REQUIRE_FULL_HISTORY: "1"
        run: node --test packages/docs/scripts/dist-seo-uniqueness.test.mjs

      - name: Merge dist outputs
        run: |
          mkdir -p merged-dist

          # Landing page at root
          cp -r packages/landing/dist/* merged-dist/
          cp -r packages/landing/dist/.nojekyll merged-dist/ 2>/dev/null || true

          # SPA at /app/
          mkdir -p merged-dist/app
          cp -r packages/workout-spa-editor/dist/* merged-dist/app/

          # Docs at /docs/
          mkdir -p merged-dist/docs
          cp -r packages/docs/.vitepress/dist/* merged-dist/docs/

          # Sitemaps: the landing ships a root sitemap.xml that is a sitemap
          # index referencing /sitemap-landing.xml (landing + editor pages)
          # and /docs/sitemap.xml (VitePress). Keep the VitePress sitemap in
          # place under /docs/ — do NOT move it to the root.

          echo "✅ Merged dist structure:"
          ls -la merged-dist/

      - name: Verify merged artifact
        run: |
          set -e
          test -f merged-dist/index.html          || { echo "❌ Missing landing index.html"; exit 1; }
          test -f merged-dist/es/index.html       || { echo "❌ Missing landing es/index.html"; exit 1; }
          test -f merged-dist/app/index.html       || { echo "❌ Missing app index.html"; exit 1; }
          test -f merged-dist/docs/index.html      || { echo "❌ Missing docs index.html"; exit 1; }
          test -f merged-dist/CNAME                || { echo "❌ Missing CNAME"; exit 1; }
          test -f merged-dist/.nojekyll            || { echo "❌ Missing .nojekyll"; exit 1; }
          test -f merged-dist/404.html             || { echo "❌ Missing 404.html"; exit 1; }
          test -f merged-dist/robots.txt           || { echo "❌ Missing robots.txt"; exit 1; }
          test -f merged-dist/sitemap.xml          || { echo "❌ Missing sitemap.xml"; exit 1; }
          test -f merged-dist/sitemap-landing.xml  || { echo "❌ Missing sitemap-landing.xml"; exit 1; }
          test -f merged-dist/docs/sitemap.xml     || { echo "❌ Missing docs/sitemap.xml"; exit 1; }
          test -f merged-dist/llms.txt             || { echo "❌ Missing llms.txt"; exit 1; }
          test -f merged-dist/docs/llms.txt        || { echo "❌ Missing docs/llms.txt"; exit 1; }
          test -f merged-dist/docs/llms-full.txt   || { echo "❌ Missing docs/llms-full.txt"; exit 1; }
          # IndexNow proves ownership by fetching /<key>.txt, whose body is the key.
          KEY=$(node scripts/geo/indexnow.mjs key)
          [ "$(cat "merged-dist/$KEY.txt" 2>/dev/null)" = "$KEY" ] || { echo "❌ Missing IndexNow key file $KEY.txt"; exit 1; }
          echo "✅ All required files present in merged artifact"

      - name: Inject SPA route fallback
        run: node scripts/inject-spa-fallback.mjs merged-dist

      # A real 200 page for the bare /editor/ URL (canonical to /app/). It
      # refuses to run without the bridge above, and leaves every deeper
      # /editor/<route> path to it.
      - name: Emit legacy /editor/ page
        run: |
          set -e
          node scripts/emit-legacy-editor-page.mjs merged-dist
          test -f merged-dist/editor/index.html || { echo "❌ Missing editor/index.html"; exit 1; }

      - name: Check site links
        env:
          REQUIRE_DOCS_DIST: "1"
        run: node scripts/check-site-links.mjs --merged merged-dist

      # The URLs this deploy changes: the live sitemaps (what engines have
      # now) against the built ones, by <loc> and <lastmod>. A failed fetch
      # leaves no live file, and the diff then skips with a warning instead
      # of submitting the whole site. The list is submitted after deploy by
      # the indexnow job, once the new pages and the key file are live.
      - name: List URLs changed since the live deploy (IndexNow)
        run: |
          set -e
          mkdir -p indexnow
          for pair in "sitemap-landing.xml landing" "docs/sitemap.xml docs"; do
            set -- $pair
            curl -sf --max-time 15 -o "indexnow/live-$2.xml" "https://kaiord.com/$1" \
              || { rm -f "indexnow/live-$2.xml"; echo "::warning::Could not fetch the live /$1"; }
          done
          node scripts/geo/indexnow.mjs diff \
            --old indexnow/live-landing.xml indexnow/live-docs.xml \
            --new merged-dist/sitemap-landing.xml merged-dist/docs/sitemap.xml \
            --out indexnow/urls.txt
          cat indexnow/urls.txt

      - name: Upload IndexNow URL list
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-urls
          path: indexnow/urls.txt
          if-no-files-found: error
          retention-days: 1

      - name: Capture SPA build marker
        id: spa_marker
        run: |
          set -e
          # Build-derived marker so the smoke step survives vite base/assetsDir refactors.
          MARKER=$(grep -oE 'src="/app/assets/index-[^"]+\.js"' merged-dist/app/index.html | head -1)
          if [ -z "$MARKER" ]; then
            echo "❌ Could not extract SPA entry-script marker from app/index.html"
            exit 1
          fi
          echo "Build marker: $MARKER"
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: merged-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # P95 = 12s; ceil(P95 × 1.5 / 60) = 1 — but the P95 only describes the run
    # where the first smoke attempt succeeds. The retry budget is what the
    # timeout has to cover, and it is 10 × (15s + 15s + 15s + 10s) = 550s worst
    # case: three curls at --max-time 15 (/app/, /404.html, /editor/) plus the
    # propagation sleep, per attempt. At 1 the job was cancelled exactly when
    # the retries were doing their job, and slow Pages propagation read as a
    # failed deploy. 10 covers the budget with room for the deploy step
    # itself, well under the build-family ceiling 20. Each further smoke probe
    # (one more curl at --max-time 15 per attempt) adds 10 × 15s = 150s to the
    # worst case; recompute this budget when adding one.
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test SPA route fallback
        env:
          MARKER: ${{ needs.build.outputs.spa_marker }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          if [ -z "$MARKER" ] || [ -z "$PAGE_URL" ]; then
            echo "❌ Missing build marker or page URL; cannot run smoke."
            exit 1
          fi
          # The deep-route fallback works in two pieces:
          #   1. /app/index.html serves the SPA bundle (positive marker)
          #   2. /404.html carries the rafgraph redirect script that bounces
          #      legacy /editor/* (and the root allowlist) into /app/#…
          # We probe both pieces directly. This sidesteps the prior smoke's
          # design flaw, which fetched /app/calendar with curl and expected
          # the SPA bundle in the response body — but that bundle only appears
          # after a JS-driven `window.location.replace` round-trip that curl
          # cannot execute.
          # Pages CDN propagation is eventually consistent; retry up to 10x at 10s.
          APP_URL="${PAGE_URL%/}/app/"
          NOT_FOUND_URL="${PAGE_URL%/}/404.html"
          LEGACY_URL="${PAGE_URL%/}/editor/"
          CANONICAL='rel="canonical" href="https://kaiord.com/app/"'
          echo "Smoke targets:"
          echo "  - $APP_URL (expect marker: $MARKER)"
          echo "  - $NOT_FOUND_URL (expect rafgraph redirect script)"
          echo "  - $LEGACY_URL (expect 200 + canonical to /app/)"
          for i in $(seq 1 10); do
            EDITOR_TMP=$(mktemp)
            NOT_FOUND_TMP=$(mktemp)
            LEGACY_TMP=$(mktemp)
            # `--http-status` would be cleaner but isn't in older curl; capture
            # the code via -w and the body via -o for portability. -L follows
            # any HTTP-level redirect so we score the final response.
            # `|| true` keeps `set -e` from killing the step on a connection
            # failure so the retry loop still runs. It is NOT `|| echo "000"`:
            # curl already writes 000 through -w when it never got a response,
            # so the echo appended a second one and the log read "000000".
            APP_CODE=$(curl -sL --max-time 15 -o "$EDITOR_TMP" -w "%{http_code}" "$APP_URL" || true)
            NOT_FOUND_CODE=$(curl -sL --max-time 15 -o "$NOT_FOUND_TMP" -w "%{http_code}" "$NOT_FOUND_URL" || true)
            # No -L: /editor/ itself must answer 200. Following a redirect
            # would score whatever it points at instead.
            LEGACY_CODE=$(curl -s --max-time 15 -o "$LEGACY_TMP" -w "%{http_code}" "$LEGACY_URL" || true)
            EDITOR_BODY=$(cat "$EDITOR_TMP" 2>/dev/null || true)
            NOT_FOUND_BODY=$(cat "$NOT_FOUND_TMP" 2>/dev/null || true)
            LEGACY_BODY=$(cat "$LEGACY_TMP" 2>/dev/null || true)
            rm -f "$EDITOR_TMP" "$NOT_FOUND_TMP" "$LEGACY_TMP"
            APP_OK=0
            NOT_FOUND_OK=0
            LEGACY_OK=0
            # /app/ is the SPA entry — must serve 200 + the bundle marker.
            [ "$APP_CODE" = "200" ] && echo "$EDITOR_BODY" | grep -qF "$MARKER" && APP_OK=1
            # /404.html is itself a real artefact (GitHub Pages serves it as
            # a regular file with status 200); Pages then ALSO uses its body
            # for the not-found fallback. We assert 200 + that the rafgraph
            # guard literal is present so the redirect only fires for
            # SPA-related 404s.
            [ "$NOT_FOUND_CODE" = "200" ] && echo "$NOT_FOUND_BODY" | grep -qF "indexOf('/editor/')" && NOT_FOUND_OK=1
            # The bare /editor/ URL is a real page (crawlers see 200, not the
            # 404 the bridge answers with), canonical to /app/.
            [ "$LEGACY_CODE" = "200" ] && echo "$LEGACY_BODY" | grep -qF "$CANONICAL" && LEGACY_OK=1
            if [ "$APP_OK" = "1" ] && [ "$NOT_FOUND_OK" = "1" ] && [ "$LEGACY_OK" = "1" ]; then
              echo "✅ Attempt $i: SPA bundle present at /app/ (200), rafgraph redirect present at /404.html (200), /editor/ canonical to /app/ (200)"
              exit 0
            fi
            echo "Attempt $i: app=$APP_OK (code=$APP_CODE) 404=$NOT_FOUND_OK (code=$NOT_FOUND_CODE) editor=$LEGACY_OK (code=$LEGACY_CODE); retrying in 10s"
            sleep 10
          done
          echo "❌ Smoke failed after 10 retries:"
          echo "    /app/ status=$APP_CODE (expect 200), marker present: $APP_OK"
          echo "    /404.html status=$NOT_FOUND_CODE (expect 200), rafgraph script: $NOT_FOUND_OK"
          echo "    /editor/ status=$LEGACY_CODE (expect 200), canonical to /app/: $LEGACY_OK"
          exit 1

      # Rollback: use workflow_dispatch on last known-good main commit SHA,
      # or revert the breaking commit on main.

  # Tells IndexNow engines (Bing, which feeds Copilot and ChatGPT search;
  # Yandex; Seznam; Naver) which URLs this deploy changed. Runs only after the
  # smoke passed, so the pages and the key file are live. An empty list logs
  # "nothing changed, skipping"; a non-200/202 answer is a warning, never a
  # failed deploy.
  indexnow:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    # One POST with a 40-URL body plus checkout and an artifact download:
    # well under a minute. 2 bounds a hung request without cutting a slow one.
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download IndexNow URL list
        uses: actions/download-artifact@v8
        with:
          name: indexnow-urls
          path: indexnow

      - name: Submit changed URLs to IndexNow
        run: node scripts/geo/indexnow.mjs submit indexnow/urls.txt
