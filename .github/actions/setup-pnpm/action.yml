name: "Setup pnpm with caching"
description: "Setup Node.js, pnpm, and configure caching for dependencies"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24.x"
  pnpm-version:
    description: "pnpm version to use"
    required: false
    default: "9.15.0"
  registry-url:
    description: >-
      npm registry URL. Leave empty (the default) for callers that don't
      publish — setting it writes an .npmrc that opts the job into npm's
      OIDC trusted-publisher detection, which release.yml needs and no
      other caller does.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    # pnpm/action-setup deletes its install dir on every run, `npm ci`s a
    # bootstrap pnpm (v11) and then `self-update`s to our version. That is
    # two uncached npmjs fetches per job, even on a node_modules hit, and on
    # a slow registry they made `Setup pnpm` take 190-300s (2026-10-15).
    # Instead, the committed pnpm-bin lockfile pins the tarball's sha512 and
    # we cache npm's content-addressed cache (_cacache), not the installed
    # files. Every job reinstalls from it with `npm ci`, and cacache re-checks
    # the sha512 on read, so a tampered cache entry never runs. On a hit the
    # install is `--offline`: zero npmjs requests, and a bad entry fails the
    # job (ENOTCACHED) instead of silently refetching.
    - name: Restore pnpm binary cache
      id: cache-pnpm-bin
      uses: actions/cache@v6
      with:
        path: ~/.cache/kaiord-pnpm-npm
        key: ${{ runner.os }}-pnpm-npm-${{ hashFiles('.github/actions/setup-pnpm/pnpm-bin/package-lock.json') }}

    - name: Install pnpm binary
      shell: bash
      env:
        WANTED: ${{ inputs.pnpm-version }}
        CACHE_HIT: ${{ steps.cache-pnpm-bin.outputs.cache-hit }}
      run: |
        dest="$RUNNER_TEMP/kaiord-pnpm-bin"
        mkdir -p "$dest"
        cp "$GITHUB_ACTION_PATH/pnpm-bin/package.json" "$GITHUB_ACTION_PATH/pnpm-bin/package-lock.json" "$dest/"
        offline=""
        if [ "$CACHE_HIT" = "true" ]; then offline="--offline"; fi
        echo "pnpm binary cache: ${CACHE_HIT:-false} -> npm ci ${offline:-(online)}"
        npm ci --prefix "$dest" --cache ~/.cache/kaiord-pnpm-npm $offline \
          --ignore-scripts --no-audit --no-fund --no-update-notifier --loglevel http
        echo "$dest/node_modules/.bin" >> "$GITHUB_PATH"
        actual=$("$dest/node_modules/.bin/pnpm" --version)
        pinned=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").packageManager || ""')
        if [ "$actual" != "$WANTED" ] || [ "${pinned%%+*}" != "pnpm@$actual" ]; then
          echo "::error::pnpm mismatch: pnpm-bin installs $actual, pnpm-version is $WANTED, packageManager is '$pinned'. Keep pnpm-bin/package.json (+ its lockfile), the pnpm-version default and packageManager in step."
          exit 1
        fi
        echo "pnpm $actual ready"

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup node_modules cache
      id: cache-node-modules
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-node-modules-${{ inputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-${{ inputs.node-version }}-
          ${{ runner.os }}-node-modules-

    # The store (~975 MB, ~16s to download and extract, plus a post-job
    # step) is only read by `pnpm install` when node_modules is not already
    # complete. On an exact node_modules hit, install prints "Already up to
    # date" without touching it, so restoring it was pure waste (measured
    # 2026-10-14 on every job using this action). Any partial or missing
    # node_modules restore still gets the store, and saves it on a miss.
    - name: Setup pnpm store cache
      id: cache-pnpm-store
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ inputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-${{ inputs.pnpm-version }}-
          ${{ runner.os }}-pnpm-store-

    - name: Display cache hit status
      shell: bash
      run: |
        echo "📦 Cache Status Report"
        echo "====================="
        echo "node_modules cache: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}"
        echo "pnpm store cache: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && '⏭️ SKIPPED (node_modules hit)' || (steps.cache-pnpm-store.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS') }}"
        echo "====================="

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
