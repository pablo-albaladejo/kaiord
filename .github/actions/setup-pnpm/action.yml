name: "Setup pnpm with caching"
description: "Setup Node.js, pnpm, and configure caching for dependencies"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24.x"
  pnpm-version:
    description: "pnpm version to use"
    required: false
    default: "9.15.0"
  registry-url:
    description: >-
      npm registry URL. Leave empty (the default) for callers that don't
      publish — setting it writes an .npmrc that opts the job into npm's
      OIDC trusted-publisher detection, which release.yml needs and no
      other caller does.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup node_modules cache
      id: cache-node-modules
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-node-modules-${{ inputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-${{ inputs.node-version }}-
          ${{ runner.os }}-node-modules-

    # The store (~975 MB, ~16s to download and extract, plus a post-job
    # step) is only read by `pnpm install` when node_modules is not already
    # complete. On an exact node_modules hit, install prints "Already up to
    # date" without touching it, so restoring it was pure waste (measured
    # 2026-10-14 on every job using this action). Any partial or missing
    # node_modules restore still gets the store, and saves it on a miss.
    - name: Setup pnpm store cache
      id: cache-pnpm-store
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ inputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-${{ inputs.pnpm-version }}-
          ${{ runner.os }}-pnpm-store-

    - name: Display cache hit status
      shell: bash
      run: |
        echo "📦 Cache Status Report"
        echo "====================="
        echo "node_modules cache: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}"
        echo "pnpm store cache: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && '⏭️ SKIPPED (node_modules hit)' || (steps.cache-pnpm-store.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS') }}"
        echo "====================="

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
