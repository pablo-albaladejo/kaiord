version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # React gets its own PR: the 19.3 renderer adds ~8.4 kB gzip to the SPA
      # entry chunk, which trips the initial-JS budget
      # (scripts/check-spa-initial-js.mjs). Raising that budget needs its own
      # evidence (docs/seo-observatory.md), so a React bump must not block the
      # other minor/patch updates. Groups match first-wins, so keep this first.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # openspec reports requirement text over 500 characters (hard-coded) 329
      # times on the existing specs (`pnpm lint:specs`). 1.13 reports it as
      # INFO; 1.14 escalates it to WARNING, which breaks zero-warnings. Taking
      # 1.14 means splitting those requirements, which is its own change, so
      # it gets its own PR, and 1.14+ is held back in `ignore` below.
      openspec:
        patterns:
          - "@fission-ai/openspec"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # packages/docs pins typescript 6.x on purpose: it renders samples through
      # @shikijs/vitepress-twoslash, whose twoslash dependency declares
      # `typescript: "^5.5.0 || ^6.0.0"` and drives the compiler API directly.
      # On 7.x the docs build dies while *loading* .vitepress/config.ts
      # ("Cannot read properties of undefined (reading 'readFile')"), so a type
      # check never gets the chance to report it. The root pin stays on 6.x
      # alongside it. Every published package already tracks 7.x, and minor and
      # patch updates still flow everywhere — only the major is held back.
      # Drop this entry once twoslash's peer range accepts typescript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # openspec 1.14 escalates the hard-coded ">500-character requirement"
      # finding from INFO to WARNING, and the existing specs trip it 329 times
      # (`pnpm lint:specs`), which breaks zero-warnings. Patches on 1.13 still
      # flow through the `openspec` group above. Drop this entry together with
      # the change that splits those requirements.
      - dependency-name: "@fission-ai/openspec"
        versions: [">=1.14.0"]
    reviewers:
      - "pablo-albaladejo"
    labels:
      - "dependencies"
      - "automated"

  # GitHub Actions (workflows + composite actions, which "/" alone does not scan)
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-pnpm"
      - "/.github/actions/consume-build-artifacts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "pablo-albaladejo"
    labels:
      - "dependencies"
      - "github-actions"
